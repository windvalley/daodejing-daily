name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要 pages 与 id-token，仓库内容只读即可
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 部署前把仓库要求的检查跑一遍，任一步失败都不发布
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
        env:
          # 项目站点固定在 /<仓库名>/ 下；绑定自定义域名后改成 /
          BASE_PATH: /daodejing-daily/
      # Pages 没有 SPA 回退，未知路径会去取 404.html；
      # 用它承载前端路由，直接打开深层链接时应用仍能启动，只是响应状态是 404
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
